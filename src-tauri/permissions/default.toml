# App-level permissions: what the shell's commands may be called with.
#
# `build.rs` autogenerates one `allow-<command>`/`deny-<command>` permission per
# entry in `APP_COMMANDS` into `permissions/autogenerated/` (gitignored, rebuilt
# by `cargo`), and this `[default]` set is what a capability picks up when it
# asks for the app's `default`.
#
# Why the whole surface here: declaring the app manifest at all switches the ACL
# on for *local* origins as well, which until then reached every command
# implicitly. `capabilities/default.json` (the shell's own first-run and
# diagnostics page, `dist/index.html`) therefore asks for `default` and keeps its
# behaviour. The served web app is a remote origin and gets a deliberately
# smaller set of its own — see `capabilities/desktop-remote.json`.
[default]
permissions = [
  "allow-check-update",
  "allow-database-url",
  "allow-desktop-info",
  "allow-get-pref",
  "allow-log-file-path",
  "allow-open-data-dir",
  "allow-open-data-subdir",
  "allow-quit",
  "allow-recent-logs",
  "allow-restart-server",
  "allow-set-database-url",
  "allow-set-decorations",
  "allow-set-pref",
  "allow-set-theme",
  "allow-set-window-title",
  "allow-set-zoom",
  "allow-stop-server",
]
