# App-level permissions: what the shell's commands may be called with.
#
# `build.rs` autogenerates one `allow-<command>`/`deny-<command>` permission per
# entry in `APP_COMMANDS` into `permissions/autogenerated/` (gitignored, rebuilt
# by `cargo`), and this `[default]` set is what a capability picks up when it
# asks for the app's `default`.
#
# This is deliberately *not* the whole Rust surface. A command that is only
# called by the native menu, the tray, or Rust internals (`quit`, `set_theme`,
# `set_window_title`, `set_zoom`, `set_decorations`, `backup_now`, the
# preference store commands, …) does not need an ACL entry at all: the ACL gates
# the webview, not Rust. The shell's own first-run/diagnostics page only invokes
# these five commands, so a compromised page cannot reach the rest either.
#
# The served web app is a remote origin and gets its own, separately enumerated
# set — see `capabilities/desktop-remote.json`. The broad `desktop-everything`
# capability this file used to feed is gone.
[default]
permissions = [
  "allow-desktop-info",
  "allow-open-data-dir",
  "allow-recent-logs",
  "allow-restart-server",
  "allow-set-database-url",
]
