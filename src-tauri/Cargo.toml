[package]
name = "noema-desktop"
version = "1.4.0"
description = "Noema — local-first workspace, as an installable desktop app"
authors = ["Noema"]
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/noema/noema"
default-run = "noema-desktop"

# The shipped app is a thin Rust shell around a supervised local server:
#  - the shell owns the window, tray, menus and lifecycle
#  - `noema-node` (a real Node runtime, bundled as the sidecar) runs the Next.js
#    standalone server out of the app's resources
# Everything shared with the site version lives in `../src/**`; nothing is forked.
#
# Dependency policy: keep this list short. Every crate here is compiled on three
# platforms in CI, so a plugin earns its place or it waits.
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
tauri-plugin-window-state = "2"
tauri-plugin-store = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "time", "rt-multi-thread", "macros", "io-util", "sync"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
directories = "5"
url = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[[bin]]
name = "noema-desktop"
path = "src/main.rs"

[lib]
name = "noema_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
