<!doctype html>
<html lang="en" data-state="starting">
  <head>
    <meta charset="utf-8" />
    <title>Noema</title>
    <meta name="color-scheme" content="light dark" />
    <style>
      /* The shell's own surface: shown while the local server starts, and if it
         cannot start. Deliberately self-contained (no build step, no fonts) so
         it renders even when everything else is broken. */
      :root {
        --bg: #ffffff;
        --fg: #37352f;
        --muted: #6b6a65;
        --border: #e9e9e7;
        --surface-2: #f7f7f5;
        --danger: #d44c47;
        --accent: #1a75d2;
        --on-accent: #ffffff;
        --radius: 6px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #191919;
          --fg: rgba(255, 255, 255, 0.85);
          --muted: rgba(255, 255, 255, 0.55);
          --border: #2f2f2f;
          --surface-2: #232323;
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.6 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
        padding: 10vh 24px;
      }
      h1 {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0 0 8px;
      }
      p {
        color: var(--muted);
        margin: 0 0 18px;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        margin-bottom: 6px;
      }
      input {
        font: inherit;
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--fg);
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 14px;
      }
      button {
        font: inherit;
        padding: 7px 14px;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        background: transparent;
        color: var(--fg);
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--on-accent);
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      details {
        margin-top: 22px;
      }
      summary {
        cursor: pointer;
        color: var(--muted);
        font-size: 13px;
      }
      #detail {
        margin-top: 14px;
        font-size: 12px;
        color: var(--danger);
        white-space: pre-wrap;
        word-break: break-word;
      }
      .spin {
        width: 13px;
        height: 13px;
        border: 2px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spin {
          animation: none;
        }
      }
      [data-state="ready"] .spin,
      [data-state="running"] .spin {
        display: none;
      }
      /* Once the server is up, the shell navigates away; if the user is seeing
         this page it is because that has not happened yet. */
      [data-state="ready"] #lead {
        color: var(--fg);
      }
    </style>
  </head>
  <body>
    <main>
      <h1><span class="spin" aria-hidden="true"></span><span id="title">Noema is starting…</span></h1>
      <p id="lead">Bringing up the local server. The first run can take a moment.</p>

      <details id="advanced">
        <summary>Advanced: database connection</summary>
        <p>
          The local server uses a Postgres database. Paste a connection string if
          the default is not yours (for example a container on another port).
        </p>
        <label for="db">DATABASE_URL</label>
        <input
          id="db"
          type="text"
          spellcheck="false"
          autocomplete="off"
          placeholder="postgresql://user:password@127.0.0.1:5432/noema"
        />
        <div class="row">
          <button class="primary" id="save">Save &amp; restart</button>
          <button id="retry">Retry</button>
          <button id="reveal">Open data folder</button>
          <button id="logs">Copy diagnostics</button>
        </div>
      </details>

      <div id="detail" role="status" aria-live="polite"></div>
    </main>

    <script>
      // `withGlobalTauri: true`, so the bridge is on the window without an import.
      const tauri = window.__TAURI__ ? window.__TAURI__.core : null;
      const events = window.__TAURI__ ? window.__TAURI__.event : null;
      const detail = document.getElementById("detail");
      const title = document.getElementById("title");
      const lead = document.getElementById("lead");
      const root = document.documentElement;

      async function invoke(command, args) {
        if (!tauri) throw new Error("The native bridge is unavailable (withGlobalTauri is off).");
        return tauri.invoke(command, args);
      }

      function showFailure(message) {
        root.dataset.state = "failed";
        title.textContent = "Noema could not start";
        lead.textContent =
          "The local server did not become ready. Check the database connection below, then retry.";
        detail.textContent = message || "";
        document.getElementById("advanced").open = true;
      }

      function showReady(info) {
        root.dataset.state = "ready";
        title.textContent = "Noema is ready";
        lead.textContent = "Opening the workspace…";
        detail.textContent = "";
        if (info && info.api_base) window.location.replace(info.api_base);
      }

      if (events) {
        events.listen("sidecar://event", (event) => {
          const payload = event.payload || {};
          if (payload.kind === "ready") showReady(payload.info);
          else if (payload.kind === "failed") showFailure(payload.message);
          else if (payload.kind === "crashed" && !payload.will_restart) {
            showFailure("The server stopped unexpectedly (code " + payload.code + ").");
          } else if (payload.kind === "starting") {
            root.dataset.state = "starting";
            title.textContent = "Noema is starting…";
          }
        });
      }

      document.getElementById("save").addEventListener("click", async () => {
        const url = document.getElementById("db").value.trim();
        if (!url) {
          detail.textContent = "Paste a connection string first.";
          return;
        }
        detail.textContent = "Restarting the server with the new connection…";
        try {
          const info = await invoke("set_database_url", { url });
          showReady(info);
        } catch (error) {
          showFailure(String(error));
        }
      });

      document.getElementById("retry").addEventListener("click", async () => {
        detail.textContent = "Restarting the server…";
        try {
          const info = await invoke("restart_server");
          showReady(info);
        } catch (error) {
          showFailure(String(error));
        }
      });

      document.getElementById("reveal").addEventListener("click", async () => {
        try {
          await invoke("open_data_dir");
        } catch (error) {
          detail.textContent = String(error);
        }
      });

      document.getElementById("logs").addEventListener("click", async () => {
        try {
          const info = await invoke("desktop_info");
          const lines = await invoke("recent_logs", { limit: 60 });
          await navigator.clipboard.writeText(
            JSON.stringify(info, null, 2) + "\n\n" + (lines || []).join("\n"),
          );
          detail.textContent = "Diagnostics copied to the clipboard (password redacted).";
        } catch (error) {
          detail.textContent = String(error);
        }
      });

      // The shell may already be past "starting" by the time this page loads.
      invoke("desktop_info")
        .then((info) => {
          if (info && info.ready) showReady(info);
          else if (info && info.database_url) document.getElementById("db").placeholder = info.database_url;
        })
        .catch(() => {});
    </script>
  </body>
</html>
