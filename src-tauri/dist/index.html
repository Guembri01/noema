<!doctype html>
<html lang="en" data-state="starting">
  <head>
    <meta charset="utf-8" />
    <title>Noema</title>
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <main>
      <h1><span class="spin" aria-hidden="true"></span><span id="title">Noema is starting…</span></h1>
      <p id="lead">Bringing up the local server. The first run can take a moment.</p>

      <details id="advanced">
        <summary>Advanced: database connection</summary>
        <p>
          The local server uses a Postgres database. Paste a connection string if
          the default is not yours (for example a container on another port).
        </p>
        <label for="db">DATABASE_URL</label>
        <input
          id="db"
          type="text"
          spellcheck="false"
          autocomplete="off"
          placeholder="postgresql://user:password@127.0.0.1:5432/noema"
        />
        <div class="row">
          <button class="primary" id="save">Save &amp; restart</button>
          <button id="retry">Retry</button>
          <button id="reveal">Open data folder</button>
          <button id="logs">Copy diagnostics</button>
        </div>
      </details>

      <div id="detail" role="status" aria-live="polite"></div>
    </main>

    <script src="index.js" defer></script>
  </body>
</html>
