# Site version: the hosted web app. Tests, a multi-arch container image, a
# vulnerability gate, keyless signing, and a real container smoke test.
#
# The image is a *standalone* Next.js build, staged by the project's own
# desktop packager (scripts/desktop/prepare.mjs) — see the Dockerfile for why.
# `next start` is deliberately not used: Next does not serve a standalone
# build that way.
#
# Publishing:
#   - pull requests  -> build linux/amd64, load it, scan it, smoke it. No push.
#   - main           -> push edge + latest + sha tags to GHCR.
#   - tags v*        -> push semver (+ latest) tags to GHCR.
# The image is signed with cosign keyless (GitHub OIDC) and carries SBOM and
# provenance attestations (docker/build-push-action).
#
# Two image jobs, on purpose, for a security reason:
#   · `image` is the pull-request path. It builds the pull request's own
#     Dockerfile, so it runs with `contents: read` and nothing else: a pull
#     request never holds a token that can publish — not even for a second,
#     not even to sign something.
#   · `publish` is the only job that may push to GHCR and the only one that
#     may ask for an OIDC token (cosign keyless). Its gate names the events
#     that may publish, so no pull-request event can reach it — not even
#     `pull_request_target`, which runs with the base branch's code and this
#     repository's write token. `github.event_name != 'pull_request'` would
#     not do that: a `pull_request_target` event satisfies it.
#   · no checkout keeps the token on disk (`persist-credentials: false`): the
#     step after a checkout runs the repository's own code, and `.git/config`
#     is a file that code can read.
name: site

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "src/**"
      - "app/**"
      - "prisma/**"
      - "public/**"
      - "scripts/desktop/**"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - ".github/workflows/site.yml"
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. The two scopes that publish — `packages: write`
# for GHCR and `id-token: write` for the keyless signature — live in the
# `publish` job alone, which no pull-request event can reach.
permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    name: build + test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: noema
          POSTGRES_PASSWORD: noema
          POSTGRES_DB: noema
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U noema" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://noema:noema@127.0.0.1:5432/noema?schema=public
      AUTH_SECRET: ci-only-secret-not-used-in-production-000000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token must not outlive the checkout: the next step installs
          # dependencies and runs the repository's own code, and `.git/config`
          # is a file that code can read.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx prisma db push --skip-generate
      - run: npm run typecheck
      - run: npx eslint --quiet .
      - run: npx vitest run --maxWorkers=2
      - run: npm run check:coherence
      - run: npm run check:use-server
      # Client-bundle guard: a client component that reaches a `node:` built-in
      # passes tsc, passes tests, and works in `next dev` — and then fails
      # `next build` with UnhandledSchemeError. That happened once; never again.
      - run: npm run check:client
      # Every t(locale, "key") must exist in the catalogue. During a parallel
      # refactor this failed as 29 cryptic `tsc` "not assignable" errors; the
      # gate names the missing keys and the files that reference them.
      - run: npm run check:i18n
      # The migrations must describe the schema. A database built by `migrate deploy`
      # (which is what the desktop app runs) once had 17 of 45 tables and four
      # features silently broken.
      - run: npm run check:schema
      # Design-system + motion ratchets. Both are pure file scans (no DB, no
      # browser) and their baselines are 0, so any new raw hex, magic z-index,
      # ad-hoc duration, legacy palette class or literal easing fails the build.
      - run: npm run check:design
      - run: npm run check:motion
      # No credential shapes in the tree. It is value-shaped, not entropy-shaped:
      # it knows what a leaked key looks like (`sk-…`, an AWS id, a private-key
      # header, a connection string with a password) rather than guessing from
      # randomness, so it does not drown in false positives. A real key did once
      # reach `.env`; this is what stops the next one.
      - run: npm run check:secrets
      - name: Design report (informative)
        if: always()
        run: npm run design:report
      - run: npm run site:build
      - run: npm run setup:search || true

  image:
    name: container image (pull request)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # The pull-request path: build the image under review, load it, scan it,
    # smoke it. No push — and no scope that could push, because the image
    # below is built from the pull request's own Dockerfile.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: noema
          POSTGRES_PASSWORD: noema
          POSTGRES_DB: noema
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U noema" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build metadata
        run: echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      # No QEMU here: this path builds linux/amd64 only, on an amd64 runner.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          # The pull-request tag; the publish job below carries the branch and
          # semver rules.
          tags: |
            type=ref,event=pr
            type=sha,format=short

      # The bytes under review: linux/amd64, loaded into the runner so the
      # scan and the smoke test below run against exactly this image.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runner
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            TRUSTED_PROXY_HOPS=${{ vars.TRUSTED_PROXY_HOPS }}
          cache-from: type=gha,scope=noema
          cache-to: type=gha,mode=max,scope=noema
          # No provenance and no SBOM here: both are attached to a *pushed*
          # image, and this path never pushes one.
          provenance: false
          sbom: false

      - name: Resolve image reference
        id: image
        run: echo "ref=${IMAGE_NAME,,}:pr-${{ github.event.number }}" >> "$GITHUB_OUTPUT"

      # Fails the pipeline on fixable HIGH/CRITICAL findings. ignore-unfixed
      # keeps upstream base-image noise from blocking a release.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Start the image
        run: |
          docker run --detach --name noema-smoke \
            --add-host=host.docker.internal:host-gateway \
            --publish 3000:3000 \
            --read-only \
            --tmpfs /tmp \
            --tmpfs /app/.next/cache \
            --volume noema-smoke-data:/data \
            --env DATABASE_URL='postgresql://noema:noema@host.docker.internal:5432/noema?schema=public' \
            --env AUTH_SECRET='ci-only-secret-not-used-in-production-000000' \
            --env APP_ORIGINS='http://localhost:3000' \
            "${{ steps.image.outputs.ref }}"

      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 90); do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:3000/api/health || true)
            if [ "$code" = "200" ]; then
              echo "healthy after ${attempt} attempt(s)"
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          echo "::error::/api/health did not return 200 (last: ${code:-no response})"
          docker logs --tail=200 noema-smoke
          exit 1

      - name: Smoke pages
        run: |
          curl -fsS http://127.0.0.1:3000/ > /dev/null
          curl -fsS http://127.0.0.1:3000/login > /dev/null

      - name: Container logs
        if: always()
        run: docker logs --tail=200 noema-smoke || true

      - name: Stop the container
        if: always()
        run: |
          docker rm --force noema-smoke || true
          docker volume rm noema-smoke-data || true

  publish:
    name: publish container image
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # The publishing path, and the only job with a token that can publish:
    # `packages: write` pushes to GHCR, `id-token: write` is the OIDC token
    # cosign signs with. The gate names the events that may publish, so no
    # pull-request event reaches this job — not even `pull_request_target`,
    # which runs with the base branch's code and this repository's write
    # token. Every step below therefore needs no `if:` of its own.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
      id-token: write
    services:
      postgres:
        image: postgres:16-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: noema
          POSTGRES_PASSWORD: noema
          POSTGRES_DB: noema
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U noema" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build metadata
        run: echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          # latest=auto keeps `latest` on semver tags; the raw rule below adds
          # it on the default branch, where `edge` also points.
          flavor: |
            latest=auto
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Promote only after the scan, the signature and the smoke test pass.
      # The build below pushes a staging tag, not the release tags: a failing
      # Trivy gate must not leave `latest`/`edge` pointing at a vulnerable
      # image. The final tags are moved to the scanned digest at the end.
      - name: Staging tag
        run: echo "STAGING_TAG=${IMAGE_NAME,,}:staging-${GITHUB_SHA}" >> "$GITHUB_ENV"

      # Both architectures, and this is the image that is published: the
      # attestation and the signature below belong to exactly these bytes.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runner
          platforms: linux/amd64,linux/arm64
          push: true
          load: false
          tags: ${{ env.STAGING_TAG }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            TRUSTED_PROXY_HOPS=${{ vars.TRUSTED_PROXY_HOPS }}
          cache-from: type=gha,scope=noema
          cache-to: type=gha,mode=max,scope=noema
          provenance: mode=max
          sbom: true

      - name: Resolve image reference
        id: image
        run: echo "ref=${IMAGE_NAME,,}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

      # Fails the pipeline on fixable HIGH/CRITICAL findings. ignore-unfixed
      # keeps upstream base-image noise from blocking a release.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless: the signature is bound to this workflow's identity through
      # GitHub OIDC, so there is no long-lived signing key to store.
      - name: Sign image (keyless)
        run: cosign sign --yes "${IMAGE_NAME,,}@${{ steps.build.outputs.digest }}"

      - name: Start the image
        run: |
          docker run --detach --name noema-smoke \
            --add-host=host.docker.internal:host-gateway \
            --publish 3000:3000 \
            --read-only \
            --tmpfs /tmp \
            --tmpfs /app/.next/cache \
            --volume noema-smoke-data:/data \
            --env DATABASE_URL='postgresql://noema:noema@host.docker.internal:5432/noema?schema=public' \
            --env AUTH_SECRET='ci-only-secret-not-used-in-production-000000' \
            --env APP_ORIGINS='http://localhost:3000' \
            "${{ steps.image.outputs.ref }}"

      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 90); do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:3000/api/health || true)
            if [ "$code" = "200" ]; then
              echo "healthy after ${attempt} attempt(s)"
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          echo "::error::/api/health did not return 200 (last: ${code:-no response})"
          docker logs --tail=200 noema-smoke
          exit 1

      - name: Smoke pages
        run: |
          curl -fsS http://127.0.0.1:3000/ > /dev/null
          curl -fsS http://127.0.0.1:3000/login > /dev/null

      - name: Container logs
        if: always()
        run: docker logs --tail=200 noema-smoke || true

      - name: Stop the container
        if: always()
        run: |
          docker rm --force noema-smoke || true
          docker volume rm noema-smoke-data || true

      # The scan, the signature and the smoke test have all passed. Move the
      # release tags to the exact digest that was tested; the staging tag is
      # only an intermediate name.
      - name: Promote the scanned image to the release tags
        run: |
          ref="${IMAGE_NAME,,}@${{ steps.build.outputs.digest }}"
          printf '%s\n' "${{ steps.meta.outputs.tags }}" | while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker buildx imagetools create --tag "$tag" "$ref"
          done

  compose-smoke:
    name: docker compose smoke
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The same event gate as the publishing job: the compose stack is not
    # smoke-tested for a pull request — the image job above does that.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare environment
        # The app refuses the placeholder that ships in .env.example (B55):
        # the session signing key must be a secret of the operator's own, and
        # every instance that copies the placeholder shares the same, public
        # one. The key is generated here and never written to the log.
        #
        # The database password is generated the same way (B09): the compose
        # stack reads it from .env and refuses to start without it, so a
        # database with a published, well-known password can never come up.
        run: |
          cp .env.example .env
          python3 - <<'PY'
          import pathlib, re, secrets
          p = pathlib.Path(".env")
          text = p.read_text()
          text = re.sub(r'(?m)^AUTH_SECRET=.*$', 'AUTH_SECRET="%s"' % secrets.token_hex(32), text)
          text = re.sub(r'(?m)^POSTGRES_PASSWORD=.*$', 'POSTGRES_PASSWORD="%s"' % secrets.token_hex(16), text)
          p.write_text(text)
          PY

      - name: Start the stack
        run: docker compose --profile app up -d --build

      - name: Wait for readiness
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3202/api/health >/dev/null 2>&1; then
              echo "ready after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::the app never became ready"
          docker compose --profile app logs --tail=120
          exit 1

      - name: Tear down
        if: always()
        run: docker compose --profile app down -v
