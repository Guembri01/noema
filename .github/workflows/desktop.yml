# Desktop app: builds the installable app for Windows, macOS (Intel + Apple
# Silicon) and Linux.
#
# Two things are unusual here on purpose:
#  · the Rust shell is built on native runners (cross-compiling a webview app is
#    not supported), and macOS is built twice for both architectures;
#  · the payload is assembled *before* Tauri packs it — the Next standalone
#    server, its static assets, the Prisma CLI and a Node runtime — because the
#    installed app must not require Node, npm or a terminal.
#
# And one thing is split on purpose, for a security reason:
#  · the token is read-only everywhere a pull request can reach, and the write
#    scope plus the signing secrets live in the `release` job, which only a tag
#    push runs. `npm ci` executes the repository's own `postinstall`, so a pull
#    request must never be able to read a token or a signing key — neither out
#    of `.git/config` (hence `persist-credentials: false` on every checkout)
#    nor out of a step's environment. The signing secrets are needed *while the
#    bundle is built*, which is why the release job builds the app itself
#    instead of reusing the artifacts of the read-only build.
name: desktop

on:
  push:
    tags: ["v*"]
    branches: [main]
  pull_request:
    paths:
      - "src-tauri/**"
      - "scripts/desktop/**"
      - "package.json"
      - "next.config.ts"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    # The branch / pull-request build: installers, uploaded as artifacts. It
    # holds no secret and no write scope. On a tag push the `release` job
    # below does the (signed) build instead, so the app is built once.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            rust-target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: ubuntu-22.04
            name: linux-x64
            rust-target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - os: macos-latest
            name: macos-arm64
            rust-target: aarch64-apple-darwin
            bundles: dmg,app
          - os: macos-15-intel
            name: macos-x64
            rust-target: x86_64-apple-darwin
            bundles: dmg,app

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The token must not outlive the checkout: the next step installs
          # dependencies, and `npm ci` runs the repository's own `postinstall`.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # The version lives in one place: the `.nvmrc` of the
          # repository (`engines.node` asks for the same major).
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.rust-target }}
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Cache the Tauri CLI
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/cargo-tauri*
          # The version is part of the key: a cached binary of another version
          # would satisfy `command -v cargo-tauri`, the pinned install below
          # would be skipped, and the pin would name a version nobody runs.
          key: tauri-cli-2.12.3-${{ runner.os }}-${{ matrix.rust-target }}-${{ hashFiles('src-tauri/Cargo.toml') }}

      - name: Install the Tauri CLI
        shell: bash
        run: |
          if ! command -v cargo-tauri >/dev/null 2>&1; then
            # An exact version, not a range: the release job signs the bundle
            # with whatever this installs, so it must be the same one every time.
            cargo install tauri-cli --version "2.12.3" --locked
          fi
          cargo tauri --version

      - name: Linux native dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config \
            libssl-dev libsoup-3.0-dev libfuse2

      - name: Install dependencies
        run: npm ci

      - name: Generate icons (from the single 1024px source)
        shell: bash
        run: |
          if [ ! -f assets/icon.png ]; then
            echo "::error::assets/icon.png is missing — the icon set is generated from it."
            exit 1
          fi
          npm run desktop:icons

      - name: Preflight
        run: node scripts/desktop/preflight.mjs
        continue-on-error: true # informational in CI; the build below is the gate

      - name: Package the payload (standalone server + Prisma CLI + Node runtime)
        run: npm run desktop:prepare
        env:
          DATABASE_URL: postgresql://noema:dummy@127.0.0.1:5432/noema?schema=public

      - name: Type-check Rust
        working-directory: src-tauri
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings

      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test --all-features

      - name: Build the app
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          # linuxdeploy ships as an AppImage; extract it instead of requiring FUSE.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        # No token and no tag: this job only builds. Creating the release — the
        # one thing that needs `contents: write` — is the `release` job's.
        with:
          # The payload is already assembled, so skip the JS build hook.
          # --verbose is deliberate: Tauri otherwise hides linuxdeploy's stderr
          # behind "failed to run linuxdeploy".
          args: --target ${{ matrix.rust-target }} --bundles ${{ matrix.bundles }} --verbose
          includeUpdaterJson: false

      - name: Upload build artifacts (branch/PR runs)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: noema-${{ matrix.name }}
          path: |
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/dmg/*.dmg
          if-no-files-found: warn
          retention-days: 7

  release:
    # The release build: the one place that holds a write-scoped token (the
    # draft release) and the Apple/Windows signing secrets (the bundle is
    # signed while it is built). A tag push alone runs this job — a pull
    # request can never reach it, whatever it puts in the tree.
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    name: release ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            rust-target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: ubuntu-22.04
            name: linux-x64
            rust-target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - os: macos-latest
            name: macos-arm64
            rust-target: aarch64-apple-darwin
            bundles: dmg,app
          - os: macos-15-intel
            name: macos-x64
            rust-target: x86_64-apple-darwin
            bundles: dmg,app

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # The version lives in one place: the `.nvmrc` of the repository
          # (`engines.node` asks for the same major).
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.rust-target }}
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Cache the Tauri CLI
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/cargo-tauri*
          # The version is part of the key: a cached binary of another version
          # would satisfy `command -v cargo-tauri`, the pinned install below
          # would be skipped, and the pin would name a version nobody runs.
          key: tauri-cli-2.12.3-${{ runner.os }}-${{ matrix.rust-target }}-${{ hashFiles('src-tauri/Cargo.toml') }}

      - name: Install the Tauri CLI
        shell: bash
        run: |
          if ! command -v cargo-tauri >/dev/null 2>&1; then
            # An exact version, not a range: the release job signs the bundle
            # with whatever this installs, so it must be the same one every time.
            cargo install tauri-cli --version "2.12.3" --locked
          fi
          cargo tauri --version

      - name: Linux native dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config \
            libssl-dev libsoup-3.0-dev libfuse2

      - name: Install dependencies
        run: npm ci

      - name: Generate icons (from the single 1024px source)
        shell: bash
        run: |
          if [ ! -f assets/icon.png ]; then
            echo "::error::assets/icon.png is missing — the icon set is generated from it."
            exit 1
          fi
          npm run desktop:icons

      - name: Preflight
        run: node scripts/desktop/preflight.mjs
        continue-on-error: true # informational in CI; the build below is the gate

      - name: Package the payload (standalone server + Prisma CLI + Node runtime)
        run: npm run desktop:prepare
        env:
          DATABASE_URL: postgresql://noema:dummy@127.0.0.1:5432/noema?schema=public

      - name: Type-check Rust
        working-directory: src-tauri
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings

      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test --all-features

      - name: Build the app and open the draft release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # linuxdeploy ships as an AppImage; extract it instead of requiring FUSE.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          # The payload is already assembled, so skip the JS build hook.
          args: --target ${{ matrix.rust-target }} --bundles ${{ matrix.bundles }}
          tagName: ${{ github.ref_name }}
          releaseName: ${{ format('Noema {0}', github.ref_name) }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false

  checksums:
    # The release job opens a *draft* release and uploads one installer per
    # platform. This job turns those assets into one `SHA256SUMS` file so a user
    # can verify what they downloaded even while the binaries are unsigned. It
    # only runs after every release matrix leg succeeded, so the file cannot
    # describe a half-published release.
    needs: release
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the release assets
        env:
          # `github.token` is the same installation token as `secrets.GITHUB_TOKEN`,
          # but this job never needs a repository secret: keep the secret namespace
          # reserved for the signed release job.
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          gh release download "$GITHUB_REF_NAME" --dir release-assets --clobber

      - name: Write SHA256SUMS
        working-directory: release-assets
        run: sha256sum -- * > SHA256SUMS

      - name: Upload SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release-assets/SHA256SUMS --clobber

  payload-smoke:
    # The check that catches a *plausible* but broken installer: it boots the
    # packaged payload (bundled runtime + staged server + migrations) and fetches
    # real pages over HTTP. Linux plus a Postgres service is the cheapest place to
    # run it, and it needs no Rust toolchain.
    #
    # It exists because a 50 MB installer was once produced that would have booted
    # to nothing: a site build had replaced `.next/`, and the desktop build reused
    # it. Booting the payload is the only thing that catches that.
    name: payload boots and serves
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: noema
          POSTGRES_PASSWORD: noema
          POSTGRES_DB: noema
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U noema" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://noema:noema@127.0.0.1:5432/noema?schema=public
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version-file: ".nvmrc", cache: npm }
      - run: npm ci
      - name: Build the payload (standalone server + static + Prisma CLI + runtime)
        run: npm run desktop:prepare
      - name: Create the schema
        run: npx prisma db push --skip-generate
      # The payload's database is PGlite behind a socket server — the one part of
      # the desktop path that `cargo test` cannot reach. Two bugs already escaped
      # into it (a client that reset mid-handshake killed the engine process; ten
      # of them left every slot leaked, so the database answered "Too many
      # connections" forever). This reproduces both against a real engine, in a
      # throwaway data directory, with no Postgres and no Tauri.
      - name: Embedded database survives rude and repeated clients
        run: npm run check:embedded-db
      - name: Smoke-test the payload (boots, migrates, serves HTTP)
        run: npm run desktop:smoke
      - name: Assert the staged payload is complete
        run: node scripts/desktop/preflight.mjs
        continue-on-error: true # rust/tauri checks are informational in this job
