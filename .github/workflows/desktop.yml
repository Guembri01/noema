# Desktop app: builds the installable app for Windows, macOS (Intel + Apple
# Silicon) and Linux.
#
# Two things are unusual here on purpose:
#  · the Rust shell is built on native runners (cross-compiling a webview app is
#    not supported), and macOS is built twice for both architectures;
#  · the payload is assembled *before* Tauri packs it — the Next standalone
#    server, its static assets, the Prisma CLI and a Node runtime — because the
#    installed app must not require Node, npm or a terminal.
name: desktop

on:
  push:
    tags: ["v*"]
    branches: [main]
  pull_request:
    paths:
      - "src-tauri/**"
      - "scripts/desktop/**"
      - "package.json"
      - "next.config.ts"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            rust-target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: ubuntu-22.04
            name: linux-x64
            rust-target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - os: macos-latest
            name: macos-arm64
            rust-target: aarch64-apple-darwin
            bundles: dmg,app
          - os: macos-13
            name: macos-x64
            rust-target: x86_64-apple-darwin
            bundles: dmg,app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cache the Tauri CLI
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri*
          key: tauri-cli-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.toml') }}

      - name: Install the Tauri CLI
        shell: bash
        run: |
          if ! command -v cargo-tauri >/dev/null 2>&1; then
            cargo install tauri-cli --version "^2" --locked
          fi
          cargo tauri --version

      - name: Linux native dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config \
            libssl-dev libsoup-3.0-dev

      - name: Install dependencies
        run: npm ci

      - name: Generate icons (from the single 1024px source)
        shell: bash
        run: |
          if [ ! -f assets/icon.png ]; then
            echo "::error::assets/icon.png is missing — the icon set is generated from it."
            exit 1
          fi
          npm run desktop:icons

      - name: Preflight
        run: node scripts/desktop/preflight.mjs
        continue-on-error: true # informational in CI; the build below is the gate

      - name: Package the payload (standalone server + Prisma CLI + Node runtime)
        run: npm run desktop:prepare
        env:
          DATABASE_URL: postgresql://noema:dummy@127.0.0.1:5432/noema?schema=public

      - name: Type-check Rust
        working-directory: src-tauri
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings

      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test --all-features

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          # The payload is already assembled, so skip the JS build hook.
          args: --target ${{ matrix.rust-target }} --bundles ${{ matrix.bundles }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Noema {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false

      - name: Upload build artifacts (branch/PR runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: noema-${{ matrix.name }}
          path: |
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/dmg/*.dmg
          if-no-files-found: warn
          retention-days: 7

  payload-smoke:
    # The check that catches a *plausible* but broken installer: it boots the
    # packaged payload (bundled runtime + staged server + migrations) and fetches
    # real pages over HTTP. Linux plus a Postgres service is the cheapest place to
    # run it, and it needs no Rust toolchain.
    #
    # It exists because a 50 MB installer was once produced that would have booted
    # to nothing: a site build had replaced `.next/`, and the desktop build reused
    # it. Booting the payload is the only thing that catches that.
    name: payload boots and serves
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: noema
          POSTGRES_PASSWORD: noema
          POSTGRES_DB: noema
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U noema" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://noema:noema@127.0.0.1:5432/noema?schema=public
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build the payload (standalone server + static + Prisma CLI + runtime)
        run: npm run desktop:prepare
      - name: Create the schema
        run: npx prisma db push --skip-generate
      - name: Smoke-test the payload (boots, migrates, serves HTTP)
        run: npm run desktop:smoke
      - name: Assert the staged payload is complete
        run: node scripts/desktop/preflight.mjs
        continue-on-error: true # rust/tauri checks are informational in this job
