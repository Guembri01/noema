      #       - run: npx prisma db push
      #       - run: npm run db:seed
      #       - run: npx playwright install --with-deps chromium
      #       - run: npx playwright test
      #         env:
      #           E2E_BASE_URL: http://localhost:3000   # + next build/start or dev
      # -------------------------------------------------------------------------
