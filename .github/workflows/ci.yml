# CI v1 — lite gate (B64). Mirrors the local FAST tier: tsc + eslint + full unit
# suite + coherence, plus the static design/i18n/boundary gates and the secret
# gate. Deliberately NO e2e: Playwright needs a real postgres (prisma db push +
# seed) and the suite runs serially (workers: 1, shared demo workspace) — see the
# commented follow-up at the bottom of this file.
# The secret gate also ships as an optional local git hook: .githooks/pre-commit
# (enable it with `git config core.hooksPath .githooks` — a local setting a
# repository cannot version, and `git commit --no-verify` skips it). The step
# below is the check.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check:fast + static gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The authoring-window gate walks the whole history of the ref
          # under review, so a shallow checkout would make it vacuous.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      # A *new* advisory in the dependency tree must fail the build. The
      # advisories that are already known — and that cannot be fixed today —
      # are listed in scripts/npm-audit-baseline.mjs with the reason; a plain
      # `npm audit --audit-level=high` would fail on those as well, and the
      # step would be dead after the first week. The gate compares the report
      # with that list: a known advisory passes, every other one fails.
      #
      # It runs before the install: the audit reads the lockfile, not
      # node_modules, so a violation fails the job in seconds instead of
      # after the whole dependency tree is on disk.
      - name: Dependency audit
        run: npm run check:audit

      - name: Install dependencies
        run: npm ci

      # npm ci already fires `postinstall: prisma generate`; kept as an explicit
      # step so a failed client generation fails its own line in the log.
      # DATABASE_URL is a dummy — `generate` only parses the schema, never connects.
      - name: Prisma generate
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://user:pass@127.0.0.1:5432/noema

      # A `Page.parentId` may only be written through `assertScopedParent()`
      # (or through an allow-listed path that holds the workspace equality by
      # construction): the tenant boundary is enforced in the application, so a
      # write path that skips the helper re-opens the cross-tenant hole.
      # The gate is a pure source scan — no build, no database, no
      # dependencies — so it runs *before* the slow steps: a violation then
      # fails the job in a second instead of after the whole test suite.
      # Its own regression test runs with it: the bypass shapes the gate
      # closes are pinned there, so a hole cannot re-open unnoticed.
      - name: Parent scope
        run: node scripts/check-parent-scope.mjs && node scripts/check-parent-scope.test.mjs

      # A link that opens a new tab hands the opened document a `window.opener`
      # unless its `rel` says `noopener`; `noreferrer` cuts the opener and the
      # `Referer` header. The tree writes `rel="noreferrer noopener"` — this
      # gate is what keeps it that way, and it also reads the conditional
      # `target`s a grep for `target="_blank"` never sees. Pure source scan: no
      # build, no database, no dependencies. Its own regression test runs with
      # it, so the shapes it has to report stay reported.
      - name: Target blank links
        run: node scripts/check-target-blank-links.mjs && node scripts/check-target-blank-links.test.mjs
      # The CSP check has to run in this workflow, in a step that cannot be
      # skipped. A pure source scan — no build, no database, no browser — so
      # it runs with the parent-scope gate above: a violation then fails the
      # job in a second instead of after the whole test suite.
      - name: CSP gate
        run: node scripts/check-csp-gate.mjs

      # = tsc --noEmit && eslint --quiet . && vitest run --changed --passWithNoTests
      # Note: in CI the checkout is clean, so `vitest --changed` sees no diff and
      # may run 0 tests; tsc + eslint still gate every push. Switching this line
      # to `npm test` (full unit suite) is a candidate CI v2 tweak.
      - name: check:fast
        run: npx tsc --noEmit && npx eslint --quiet . && npm test  # full suite: --changed is vacuous on a clean checkout

      - name: Coherence gate
        run: node scripts/check-coherence.mjs

      # The repository is published as-is, so a committed credential is public the
      # moment it lands. Value-shaped patterns — see the script for the reasoning.
      # The gate's own regression test runs with it: the shapes it closes are
      # pinned there, so a hole cannot re-open unnoticed.
      - name: Secret gate
        run: node scripts/check-secrets.mjs && node scripts/check-secrets.test.mjs

      # The scan above sees only the *present* of the repository. The *past* is
      # a second gate: a credential that was committed and later removed is
      # still in the published history — the commit is the publication, not the
      # current tree. The scan walks every blob of the ref under review, which
      # is complete here because the checkout above is full-depth.
      - name: Secret gate (history)
        run: node scripts/check-secrets.mjs --history

      # Every image the repository pulls has to be pinned by digest. A tag is a
      # name, not a version: the registry decides which bits the build gets, so
      # the same commit can produce an image nobody reviewed. The gate is a
      # pure file scan — no registry, no network — and its own regression test
      # runs with it, so the shapes that once slipped through stay reported.
      - name: Image pins
        run: node scripts/check-image-pins.mjs && node scripts/check-image-pins.test.mjs
      # The compose stack must not publish its database on every interface of
      # the machine, and it must not carry a fixed database password: the
      # password comes from `.env`, and Compose refuses to start without it.
      # The gate reads the compose file and the `.env` template; its own
      # regression test runs with it, so the shapes the gate closes stay
      # closed.
      - name: Compose exposure
        run: node scripts/check-compose-exposure.mjs && node scripts/check-compose-exposure.test.mjs

      # Every commit — author *and* committer date — must land inside a Noema
      # authoring window (Wed–Sat evenings, Europe/Paris). See
      # src/lib/dates-policy.ts for the rule and the tests that pin its edges.
      # A commit GitHub itself created is exempt as a whole: the anchor is the
      # committer (an App account, or the identity GitHub commits merges
      # under), so neither field of it is checked. The merge commit GitHub
      # synthesises for a pull request needs exactly that — it is dated when
      # GitHub rebuilt the ref, and it carries the human's address in its
      # author field.
      - name: Authoring windows
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-commit-dates.mjs

      # The pre-commit hook is a convenience of the clone, not a check:
      # `core.hooksPath` is a local setting and `--no-verify` skips it. The two
      # steps above are the check. This one keeps the documentation saying so,
      # and keeps the two steps from quietly losing their teeth.
      - name: Hook gate
        run: node scripts/check-hook-gate.mjs

      # The remaining static gates. All are offline and take seconds; they are
      # required locally, so a pull request that fails one fails here too.
      - name: Design tokens
        run: node scripts/check-design-system.mjs --check

      - name: i18n keys
        run: node scripts/check-i18n-keys.mjs

      - name: Server boundaries
        run: node scripts/check-use-server.mjs

      # The response must not name the framework. Next.js sends
      # `X-Powered-By: Next.js` on every HTML response while `poweredByHeader`
      # is on (it is on by default), and the security-header map cannot cover
      # it: `headers()` only adds headers, the server sets this one itself.
      # The gate reads `next.config.ts` and fails when the switch is missing
      # or not `false`; its own regression test runs with it.
      - name: Framework disclosure
        run: node scripts/check-powered-by.mjs && node scripts/check-powered-by.test.mjs
      # The HSTS header follows the environment (`HSTS_MAX_AGE`), so the gate
      # evaluates the real configuration instead of reading a source: the
      # default must send one year, `HSTS_MAX_AGE=0` must send no header at
      # all, a declared max-age must send exactly that one, and a value that
      # cannot be parsed must send none (fail closed). The configuration is
      # TypeScript, hence `tsx`.
      - name: HSTS header
        run: npm run check:hsts

      - name: Client bundle
        run: node scripts/check-client-bundle.mjs

      # The compose smoke test of the site workflow can only succeed if the
      # workflow, the compose file and the image agree: the stack must be
      # started with the profile that gates the app service, the probe must
      # ask for the port the compose file publishes, and the image must apply
      # the migrations before the probe. The compose job itself only runs on a
      # push to `main` — this gate is what keeps a pull request from breaking
      # the container path unseen. It is a pure file scan: no Docker, no
      # database.
      - name: Compose smoke
        run: node scripts/check-compose-smoke.mjs

      # The feature sheet (docs/Noema-features.pdf) is derived from the README's
      # feature tables and the screenshot report. This asserts every feature row
      # and every screenshot is still placed in it — rendering it needs Edge, so
      # the render itself stays local.
      - name: Feature sheet coverage
        run: node scripts/features-pdf.mjs --check

      # ----- Follow-up (CI v2, NOT enabled): e2e with a postgres service -------
      # Uncomment as a SEPARATE job when the suite is CI-stable; keep `check` as
      # the status check and start the e2e job as allow-failure — whether a red
      # run of `check` blocks a merge is the repository's protection setting
      # (branch protection / ruleset), not a property of this workflow:
      #
      #   e2e:
      #     runs-on: ubuntu-latest
      #     needs: check
      #     continue-on-error: true          # allow-failure at first; ratchet later
      #     services:
      #       postgres:
      #         image: postgres:16
      #         env:
      #           POSTGRES_USER: noema
      #           POSTGRES_PASSWORD: noema
      #           POSTGRES_DB: noema
      #         ports:
      #           - 5432:5432
      #         options: >-
      #           --health-cmd pg_isready --health-interval 10s
      #           --health-timeout 5s --health-retries 5
      #     env:
      #       DATABASE_URL: postgresql://noema:noema@127.0.0.1:5432/noema
      #     steps:
      #       - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      #       - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      #         with: { node-version: 24, cache: npm }
      #       - run: npm ci
      #       - run: npx prisma db push
      #       - run: npm run db:seed
      #       - run: npx playwright install --with-deps chromium
      #       - run: npx playwright test
      #         env:
      #           E2E_BASE_URL: http://localhost:3000   # + next build/start or dev
      # -------------------------------------------------------------------------

  rust-advisories:
    # The Rust half of the tree has its own advisory database (RustSec), and
    # `cargo audit` is not part of the Rust toolchain — it is installed here.
    #
    # The two advisories that are ignored below are the ones the tree carries
    # today. Both are the same issue (CVE-2026-111943): a distrusted emSign
    # intermediate whose private key is public.
    #   · RUSTSEC-2026-0381 — webpki-roots; the tree carries 1.0.9, the fix
    #     is 1.0.10.
    #   · RUSTSEC-2026-0382 — rustls-webpki; the tree carries 0.103.15, the
    #     fix is 0.103.16.
    # Moving them is a `cargo update` of the Tauri dependency tree, which this
    # pull request does not make — until it does, the two are ignored with
    # their reason, and every other advisory fails this job.
    name: rust advisories
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The token must not outlive the checkout: the steps below install
          # and build code, and a read-scoped token in .git/config is a token
          # the code under review can read.
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Install cargo-audit
        # An exact version, not a range: the audit is a gate, and a gate that
        # changes its own tool without a commit cannot be reviewed.
        run: cargo install cargo-audit --version "0.22.2" --locked

      - name: Rust advisory audit
        working-directory: src-tauri
        run: |
          cargo audit \
            --ignore RUSTSEC-2026-0381 \
            --ignore RUSTSEC-2026-0382
  # The CSP gate (B82): `scripts/check-csp.mjs` asserts against a *running
  # production server* that every inline script is nonced or hash-pinned. It
  # ran in no workflow at all, so a CSP regression was only ever noticed by
  # hand.
  #
  # This job gives the check what it needs: a database (it signs in with the
  # seeded demo user), a production build, a running server and a browser.
  #
  # It is a separate job on purpose — the `check` job above stays the fast
  # required status check, and a build plus a browser do not belong in it.
  #
  # Nothing in it may be skipped: no `continue-on-error`, no `|| true`, no
  # `if:` on the step or on the job. `scripts/check-csp-gate.mjs` checks that
  # mechanically, so the gate cannot rot into a green no-op.
  csp:
    name: CSP gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: noema
          POSTGRES_PASSWORD: noema
          POSTGRES_DB: noema
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U noema" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://noema:noema@127.0.0.1:5432/noema?schema=public
      AUTH_SECRET: ci-only-secret-not-used-in-production-000000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The token must not outlive the checkout: the next step installs
          # dependencies and runs the repository's own code, and `.git/config`
          # is a file that code can read.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The schema and the demo user the check signs in with: `db:seed` creates
      # `demo@noema.local` / `password123` and the `demo-workspace` the check
      # loads after the login.
      - run: npx prisma db push --skip-generate
      - run: npm run db:seed
      # The browser the check drives: the bundled Playwright Chromium, not the
      # Edge the local run uses — a CI runner has no Edge.
      - run: npx playwright install --with-deps chromium
      # A production build: `next dev` serves a deliberately laxer policy, so a
      # script the production CSP blocks is invisible in dev.
      - run: npm run build
      - name: Start the production server
        run: |
          nohup npm run start -- --port 3210 > /tmp/noema-csp-server.log 2>&1 &
      - name: Wait for the server
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3210/api/health > /dev/null; then
              echo "ready after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::the app never became ready"
          cat /tmp/noema-csp-server.log
          exit 1
      - name: CSP check
        run: npm run check:csp -- --base http://127.0.0.1:3210 --browser chromium
      # The server log — the first thing to look at when the check fails.
      - name: Server log
        if: always()
        run: tail -n 200 /tmp/noema-csp-server.log || true
