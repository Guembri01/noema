# Dependabot is switched off in this fork on purpose.
#
# The CI's authoring-window gate refuses every commit that is not dated inside
# one of the project's windows, and a Dependabot branch is authored by a bot —
# so as long as such a branch exists, the gate fails on **every** branch of the
# repository, not only on the bot's own. The gate fix (upstream issue #100)
# teaches the gate to look at the ref under review instead of every ref; until
# the upstream merges it, this fork keeps its branch list free of bot commits.
#
# The dependency updates of the upstream are not lost: they arrive here through
# the upstream's own release history, which this fork follows.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    enabled: false
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    enabled: false
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    enabled: false
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    enabled: false
