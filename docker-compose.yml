services:
  db:
    image: postgres:16-alpine
    container_name: noema-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: noema
      POSTGRES_PASSWORD: noema
      POSTGRES_DB: noema
    ports:
      - "5433:5432"
    volumes:
      - noema-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noema -d noema"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  noema-db-data:
