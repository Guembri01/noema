services:
  # Postgres for local development and self-hosting. Pinned by digest so an
  # unattended `docker compose pull` cannot move the database under a running
  # install; bump the digest deliberately.
  db:
    image: postgres:16-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    container_name: noema-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: noema
      # The password is never written down here. It comes from `.env`
      # (POSTGRES_PASSWORD), and the `:?` form makes Compose REFUSE to start
      # when it is missing — so a database with a publicly known password can
      # never come up, not even by accident.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - copy .env.example to .env and set it}"
      POSTGRES_DB: noema
    ports:
      # Bound to the loopback interface on purpose. A published port without a
      # host part binds EVERY interface of the machine, so anyone who can
      # reach the host can talk to the database - and the database holds every
      # workspace's content, password hashes and token hashes. Keep it on
      # 127.0.0.1 (see SECURITY.md).
      - "127.0.0.1:5433:5432"
    volumes:
      - noema-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noema -d noema"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Application service — PROFILE-GATED, so a plain `docker compose up` keeps
  # starting ONLY the `db` service (the dev loop and `npm run backup` are
  # untouched). Start the app explicitly:
  #
  #   docker compose pull app                       # published image from GHCR
  #   docker compose --profile app up -d            # start db + app
  #   docker compose --profile app up -d --build    # build the image locally
  #
  # Secrets come from .env at run time (env_file) — never baked into the image.
  app:
    profiles: ["app"]
    # Published multi-arch image (amd64 + arm64). Override NOEMA_IMAGE to pin a
    # digest, e.g. NOEMA_IMAGE=ghcr.io/guembri01/noema@sha256:…
    image: ${NOEMA_IMAGE:-ghcr.io/guembri01/noema:latest}
    build:
      context: .
      target: runner
      args:
        VERSION: ${NOEMA_VERSION:-dev}
        REVISION: ${NOEMA_REVISION:-unknown}
        BUILD_DATE: ${NOEMA_BUILD_DATE:-1970-01-01T00:00:00Z}
        # Edge middleware reads this at build time. Set it in .env to the
        # number of trusted reverse proxies (1 for a single nginx/Caddy).
        TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-}
    container_name: noema-app
    restart: unless-stopped
    # The image already handles SIGTERM; init reaps any child the Prisma CLI
    # leaves behind during migrations.
    init: true
    stop_grace_period: 30s
    env_file: .env
    environment:
      # In-network DB host: the .env DATABASE_URL points at localhost:5433 on
      # the host, which is unreachable from inside the container. The password
      # is the one from .env — the same value the db service got, so the two
      # can never drift apart.
      DATABASE_URL: "postgresql://noema:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - copy .env.example to .env and set it}@db:5432/noema?schema=public"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # Public origin(s) the browser uses. The boot wrapper recomputes the
      # Server Action allowlist from this at run time (reverse proxy, tunnel,
      # LAN address) — build-time interfaces are never baked into the image.
      APP_ORIGINS: ${APP_ORIGINS:-http://localhost:3202}
      # Must match the build arg above: the Edge middleware copy is baked at
      # build time, the Node-side guards read this at run time.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-}
      # Writable state. Mounted as a named volume below.
      NOEMA_DATA_DIR: /data
      STORAGE_DIR: /data/uploads
      SESSION_STORE_PATH: /data/sessions.json
      BACKUP_DIR: /data/backups
    ports:
      # Host 3202 (3200 prod / 3201 dev are sacred; the container's own 3000
      # stays internal).
      - "3202:3000"
    volumes:
      - noema-app-data:/data
    # Hardening: the process runs as UID 10001, needs no capabilities, and
    # writes only to /data and the two cache/temp mounts.
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # GET /api/health: 200 = healthy, 503 (or no answer) = unhealthy.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  noema-db-data:
  noema-app-data:
